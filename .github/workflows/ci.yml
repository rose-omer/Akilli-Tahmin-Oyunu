name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tahmin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/tahmin
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tahmin_shadow
      # tests/integration: Prisma deposu gerçek Postgres'e karşı (pg adapter'ı ile).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tahmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      - name: Migration'ları boş veritabanına uygula
        run: npx prisma migrate deploy
      - name: Şema sapması denetimi (migration ile şema aynı mı?)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE tahmin_shadow"
          npm run db:diff

      - name: Birim ve Postgres entegrasyon testleri
        run: npm test

      - run: npm run build

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler (Gemini ve veritabanı sahte)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
